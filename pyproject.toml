[project]
name = "procurement-agent"
version = "0.1.0"
description = "Local, air-gapped document intelligence for procurement (PDF/DOCX/XLSX extraction with citations)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
dependencies = [
    # --- web ---
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.18",
    "jinja2>=3.1",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    # --- documents ---
    "docling>=2.129",
    # report/docx_annotate.py imports this at module level in src/, so it is a runtime
    # dependency and not a test one. It worked only because docling happens to pull it in.
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "pypdfium2>=4.30",
    "pillow>=10.4",
    # --- llm ---
    "httpx>=0.27",
    # --- storage / security / logging ---
    "sqlalchemy>=2.0",
    "structlog>=24.4",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=3.0"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "bandit>=1.7",
    "pip-audit>=2.7",
    "pre-commit>=3.8",
    "reportlab>=4.2",
    "types-openpyxl",
    "pandas-stubs",
    "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/procurement_agent"]

# CPU-only torch wheels: never pull CUDA builds (multi-GB, useless on our servers)
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
# agent worktrees and editor state: other checkouts, not this project's code
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "S", "A", "C4", "SIM", "PTH", "RUF", "ASYNC", "T20"]
# B008: FastAPI Depends() idiom. S101 (assert) is NOT ignored here: it used to be, "for tests",
# which also let asserts into src/ where `python -O` strips them and bandit fails the gate on
# them. tests/** ignores all of "S" below.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# RUF001/RUF003: these files exist to handle visually ambiguous characters, so they have
# to contain them.
"tests/**" = ["S", "T20", "RUF001", "RUF002", "RUF003"]
"src/procurement_agent/extraction/normalize.py" = ["RUF001", "RUF002", "RUF003"]
"src/procurement_agent/checks/boq.py" = ["T20"]  # has a CLI entry point
"scripts/**" = ["T20", "S603", "S607"]
"src/procurement_agent/cli.py" = ["T20"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
files = ["src/procurement_agent"]
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["docling.*", "docling_core.*", "slowapi.*", "pypdfium2.*", "argon2.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# --strict-markers: a typo in a marker name would otherwise silently select nothing, and a
# CI job filtering on "not e2e" would quietly start running the slow tests (or skip real ones).
addopts = ["--strict-markers"]
markers = [
    "e2e: full pipeline against a live Ollama (slow)",
    "docling: requires docling models downloaded",
]
# Warnings are errors when our own code raises them, so a deprecation in procurement_agent
# fails the build the day it appears instead of the day the API is removed. Third-party
# warnings we cannot fix are ignored one message at a time; a blanket
# "ignore::DeprecationWarning" (what this used to be) also hid every warning about OUR calls.
filterwarnings = [
    "error:::procurement_agent",
    # starlette.testclient prefers httpx2. Not added as a dev dependency: the only httpx2 in
    # the offline cache (2.11.0) carries PYSEC-2026-3846, which would fail pip-audit. Adopt it
    # at >=2.12 with network access and delete this line.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
    # starlette.testclient itself still references the deprecated anyio alias.
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
    # Docling serialises its own deprecated pipeline-option defaults; we set neither option.
    "ignore:`force_full_page_ocr` is deprecated:DeprecationWarning",
    "ignore:This field is deprecated. Use `generate_page_images=True`:DeprecationWarning",
]

[tool.coverage.run]
source = ["procurement_agent"]
branch = true

[tool.coverage.report]
# Measured at 87-88% (branch coverage, -m "not e2e and not docling", no Docling models). The
# floor sits a little below so that a new, reasonably tested module does not fail the gate,
# while losing the tests of an existing one does. Raise it as coverage rises; never lower it
# to make a build pass.
fail_under = 85
show_missing = false
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
