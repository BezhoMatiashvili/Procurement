[project]
name = "procurement-agent"
version = "0.1.0"
description = "Local, air-gapped document intelligence for procurement (PDF/DOCX/XLSX extraction with citations)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
dependencies = [
    # --- web ---
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.18",
    "jinja2>=3.1",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    # --- documents ---
    "docling>=2.129",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "pypdfium2>=4.30",
    "pillow>=10.4",
    # --- llm ---
    "httpx>=0.27",
    # --- storage / security / logging ---
    "sqlalchemy>=2.0",
    "structlog>=24.4",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=3.0"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "bandit>=1.7",
    "pip-audit>=2.7",
    "pre-commit>=3.8",
    "reportlab>=4.2",
    "python-docx>=1.1",
    "types-openpyxl",
    "pandas-stubs",
    "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/procurement_agent"]

# CPU-only torch wheels: never pull CUDA builds (multi-GB, useless on our servers)
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "S", "A", "C4", "SIM", "PTH", "RUF", "ASYNC", "T20"]
ignore = ["S101", "B008"]  # S101: assert in tests; B008: FastAPI Depends() idiom

[tool.ruff.lint.per-file-ignores]
# RUF001/RUF003: these files exist to handle visually ambiguous characters, so they have
# to contain them.
"tests/**" = ["S", "T20", "RUF001", "RUF002", "RUF003"]
"src/procurement_agent/extraction/normalize.py" = ["RUF001", "RUF002", "RUF003"]
"src/procurement_agent/checks/boq.py" = ["T20"]  # has a CLI entry point
"scripts/**" = ["T20", "S603", "S607"]
"src/procurement_agent/cli.py" = ["T20"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
files = ["src/procurement_agent"]
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["docling.*", "docling_core.*", "slowapi.*", "pypdfium2.*", "argon2.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "e2e: full pipeline against a live Ollama (slow)",
    "docling: requires docling models downloaded",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
