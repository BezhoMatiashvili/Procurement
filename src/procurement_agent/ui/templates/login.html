{% extends "base.html" %}
{% block content %}
<h1>Sign in</h1>
<form method="post" action="/ui/login" class="card narrow">
  <input type="hidden" name="next" value="{{ next }}">
  <label>API key <input type="password" name="api_key" autocomplete="off" required autofocus></label>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <button type="submit">Sign in</button>
</form>
{% endblock %}
