{% extends "base.html" %}
{% block title %}{{ t("login.title") }} · {{ t("app.name") }}{% endblock %}
{% block content %}
<h1>{{ t("login.title") }}</h1>
<form method="post" action="/ui/login" class="card narrow">
  <input type="hidden" name="next" value="{{ next }}">
  <label for="api_key">{{ t("login.key") }}</label>
  <input id="api_key" type="password" name="api_key" autocomplete="off" required autofocus
         {% if error %}aria-invalid="true" aria-describedby="key-error"{% endif %}>
  {% if error %}<p id="key-error" class="error" role="alert">{{ error }}</p>{% endif %}
  <button type="submit">{{ t("login.title") }}</button>
</form>
{% endblock %}
