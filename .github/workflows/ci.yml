# Quality gate. scripts/check.sh runs the same steps locally; keep the two in step.
#
# Third-party actions are pinned to the commit their major-version tag pointed at on 2026-10-02
# (the tag is kept in the comment), so a re-pointed tag cannot change what runs with repository
# access. To move one on purpose: `gh api repos/<owner>/<name>/commits/<tag> --jq .sha`.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.12.8"          # the uv that wrote uv.lock; the Dockerfile uses the same one
  PYTHONUNBUFFERED: "1"
  # Tests must never reach Hugging Face or any model host; the app sets these too.
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"

jobs:
  repo-guard:
    name: no documents, databases, keys or env files in the repository
    # The generic rule, in CI as well as in the pre-commit hook: a client document that reaches a
    # remote cannot be taken back. Only synthetic fixtures under tests/fixtures/ may be documents.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - run: scripts/check_no_documents.sh

  offline:
    name: the product runs with no network (loopback-only namespace)
    # scripts/verify_offline.sh runs the real application and a stub model server in a network
    # namespace that has loopback and nothing else, so an attempt to leave the machine fails in
    # the kernel. It exits 2 (a failure here) if the runner cannot create the namespace.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked --all-groups
      # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: scripts/verify_offline.sh --quick

  lint:
    name: lint, types, static security
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      # --locked fails when pyproject.toml and uv.lock disagree; --frozen would silently use
      # the stale lock.
      - run: uv sync --locked --all-groups
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run bandit -q -c pyproject.toml -r src

  test:
    name: unit + integration tests (coverage)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked --all-groups
      # e2e needs a live Ollama and docling needs downloaded models; neither exists on a
      # hosted runner. The coverage floor is [tool.coverage.report] fail_under in pyproject.toml.
      - run: >
          uv run pytest -q -m "not e2e and not docling"
          --cov=procurement_agent --cov-report=term --cov-report=xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: always()
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 14

  mutation:
    name: the security tests fail when the control they guard is removed
    # scripts/mutate_security.py breaks one security property of a copy of src/ at a time
    # (ownership not checked, a header dropped, an outbound lookup allowed, ...) and requires a
    # test to fail. A guard test that cannot fail is not a guard; this is what keeps them honest.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked --all-groups
      - run: uv run python scripts/mutate_security.py

  audit:
    name: dependency vulnerabilities (pip-audit)
    # Required, not advisory. It needs network access to the vulnerability database, which is
    # why scripts/check.sh can skip it with --offline; CI is where it must pass.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked --all-groups
      # Audit exactly what uv.lock pins (not whatever pip would resolve). torch comes from the
      # CPU wheel index and exports as `2.14.1+cpu`, a local version PyPI does not list: pip-audit
      # --strict refuses it. The `+cpu` build is the PyPI release's code, so the advisories for
      # `2.14.1` are the ones that apply, and that is what is audited.
      - run: >
          uv export --locked --all-groups --no-hashes --no-emit-project
          --format requirements-txt -o "$RUNNER_TEMP/requirements-audit.txt"
      - run: sed -i -E 's/(==[0-9][^ ;+]*)\+[A-Za-z0-9.]+/\1/' "$RUNNER_TEMP/requirements-audit.txt"
      - run: >
          uv run pip-audit --strict --disable-pip --no-deps
          -r "$RUNNER_TEMP/requirements-audit.txt"

  secrets:
    name: secret scan (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0          # scan the whole history, not only the last commit
      # The container image is used instead of gitleaks-action, which needs a paid licence
      # key on organisation accounts. Same version as .pre-commit-config.yaml.
      - run: >
          docker run --rm -v "$GITHUB_WORKSPACE:/repo" zricethezav/gitleaks:v8.21.2@sha256:0e99e8821643ea5b235718642b93bb32486af9c8162c8b8731f7cbdc951a7f46
          git /repo --redact --verbose --exit-code 1
