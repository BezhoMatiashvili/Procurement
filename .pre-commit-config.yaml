# Fast per-commit subset of scripts/check.sh (which CI runs in full). Formatting here rewrites
# files; check.sh and CI only verify it (`ruff format --check`), so both agree on the result.
# pytest and pip-audit are not hooks: one is slow and the other needs network access.
repos:
  - repo: local
    hooks:
      - id: block-documents
        name: block documents, archives, databases and keys (only tests/fixtures may hold documents)
        entry: scripts/check_no_documents.sh
        language: script
        pass_filenames: true
      - id: ruff
        name: ruff
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: uv-lock
        name: uv.lock matches pyproject.toml
        entry: uv lock --check --offline
        language: system
        files: ^(pyproject\.toml|uv\.lock)$
        pass_filenames: false
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        pass_filenames: false
      - id: bandit
        name: bandit
        entry: uv run bandit -q -c pyproject.toml -r src
        language: system
        pass_filenames: false
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
