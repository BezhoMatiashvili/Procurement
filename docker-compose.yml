# Production-style deployment: the app and Ollama share an INTERNAL network with no route to
# the outside world. Only the app port is published, and only on localhost — put a TLS reverse
# proxy (Caddy/nginx with the company CA) in front of it.
#
# Before first start (on a machine with internet): ./scripts/prefetch_models.sh
# Then copy ./models and the `ollama` volume to the server.

services:
  app:
    build: .
    image: procurement-agent:0.1.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    env_file: .env
    environment:
      PA_ENV: prod
      PA_OLLAMA_BASE_URL: http://ollama:11434
      PA_DATA_DIR: /data
      PA_DOCLING_ARTIFACTS_PATH: /models/docling
    volumes:
      - app-data:/data                       # uploads, results, SQLite — put this on an encrypted disk
      - ./models:/models:ro
    networks: [internal]
    depends_on: [ollama]
    read_only: true
    tmpfs:
      - /tmp:size=2g,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    mem_limit: 12g
    pids_limit: 512

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama
    networks: [internal]
    environment:
      OLLAMA_KEEP_ALIVE: "-1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
    security_opt:
      - no-new-privileges:true
    mem_limit: 16g
    # no ports: reachable only from the app on the internal network

networks:
  internal:
    internal: true          # no egress: containers cannot reach the internet at all

volumes:
  app-data:
  ollama:
