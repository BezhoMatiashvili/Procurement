# Production-style deployment. Three containers, two INTERNAL networks (no route to the outside
# world) and no more connectivity than each pair needs:
#
#     host reverse proxy -> 127.0.0.1:8000 -> proxy --[internal]--> app --[llm]--> ollama
#
# The proxy cannot reach Ollama, and Ollama cannot reach the proxy. A small relay (`proxy`) is the
# only container with a published port, and only on 127.0.0.1: put the TLS reverse proxy
# (Caddy/nginx with the company CA) in front of 127.0.0.1:8000 on the host. The app answers only to
# the names in PA_ALLOWED_HOSTS (set it in .env). See docs/PRODUCTION_READINESS.md.
#
# Why the relay exists: Docker does not publish ports of a container whose only network is
# `internal: true` (verified on Docker 29: the port mapping is silently dropped). The app used
# to publish 127.0.0.1:8000 from the internal network, so nothing was ever listening there.
# Attaching the app to a second, routable network would give it egress; the relay keeps the
# app and Ollama without a default route, stores nothing, and gets no outbound NAT itself.
#
# Before first start (on a machine with internet): ./scripts/prefetch_models.sh
# Then copy ./models and the `ollama` volume to the server.
#
# Compose reads ${VARIABLES} below from the shell or from .env next to this file.

services:
  app:
    build: .
    image: procurement-agent:0.1.0
    restart: unless-stopped
    init: true                               # reap tesseract children, forward SIGTERM
    # Not `uvicorn ...` directly: a request that wedges the process (a regex or a native parser
    # holding the GIL) leaves it running and unhealthy, and Docker restarts on exit, not on a failed
    # health check. The supervisor probes /ready over loopback and restarts the server when it stops
    # answering (scripts/supervise.py). It runs the same command as the image's CMD.
    command: ["python", "/app/scripts/supervise.py"]
    env_file: .env
    environment:
      PA_ENV: prod
      PA_OLLAMA_BASE_URL: http://ollama:11434
      # The names users type in the browser, comma separated (tasks.company.example). Compose
      # refuses to start without it, and so does the app: a request that names any other host -
      # a tunnel, a DNS-rebinding page - is refused. Forward the original Host from the TLS proxy.
      PA_ALLOWED_HOSTS: ${PA_ALLOWED_HOSTS:?set PA_ALLOWED_HOSTS in .env to the host names users type}
      PA_DATA_DIR: /data
      PA_DOCLING_ARTIFACTS_PATH: /models/docling
      # Baked into the image (Dockerfile), so a development path copied into .env cannot point
      # the prose spelling check at a directory the container does not have.
      PA_SPELLING_DICTIONARY_PATH: /app/dictionaries/hunspell
      # Only the relay may set X-Forwarded-For. Client addresses feed the audit log and the
      # rate-limit buckets; trusting any other peer would let a caller choose its own address.
      FORWARDED_ALLOW_IPS: ${PA_PROXY_IP:-172.30.231.10}
    volumes:
      - app-data:/data                       # uploads, results, SQLite — put this on an encrypted disk
      - ./models:/models:ro
    networks: [internal, llm]                # proxy -> app on `internal`; app -> ollama on `llm`
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      # /ready: DB reachable, job worker alive and heartbeating. /health stays pure liveness.
      test: ["CMD", "python", "-c", "import sys,urllib.request as u; sys.exit(0 if u.urlopen('http://127.0.0.1:8000/ready', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    # Docker's default of 10 s would SIGKILL a worker in the middle of writing a result. Keep
    # this above the worker's stop timeout (see .env.example).
    stop_grace_period: 60s
    read_only: true
    tmpfs:
      # Docker mounts a tmpfs noexec,nosuid,nodev anyway (verified); written out so the policy is
      # visible, and so a different runtime's default cannot loosen it.
      - /tmp:size=2g,mode=1777,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    ulimits:
      core: 0                                # a crash must not leave a core file of document text
    mem_limit: 12g
    pids_limit: 512
    # 0 = no cap. Set PA_APP_CPUS (below the host's core count) so one runaway parse cannot
    # starve the host; Docker refuses a number above the host's cores, so there is no default.
    cpus: ${PA_APP_CPUS:-0}

  ollama:
    # Pinned by version AND digest: `latest` would change the model runtime (and therefore the
    # extraction output) on the next pull. Upgrade deliberately and re-run scripts/evaluate.py.
    image: ollama/ollama:0.34.2@sha256:da6e0dc5651df159e45686fd663c4dbe1624a52c44d7280eeac1551d8f865532
    restart: unless-stopped
    init: true
    volumes:
      - ollama:/root/.ollama
    networks: [llm]
    environment:
      # Ollama's own cloud features (remote inference, web search): off. A model whose name ends in
      # "-cloud" would otherwise send the prompt - the document - to ollama.com through this server.
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_KEEP_ALIVE: "-1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
    healthcheck:
      # The image has no curl/wget; `ollama list` talks to the local server and exits 1 when
      # it is not answering.
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    # Read-only root, noexec /tmp, no capabilities, no network: verified with a real generation.
    read_only: true
    tmpfs:
      - /tmp:size=1g,mode=1777,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    ulimits:
      core: 0
    mem_limit: 16g
    pids_limit: 1024
    cpus: ${PA_OLLAMA_CPUS:-0}
    # no ports: reachable only from the app on the `llm` network

  proxy:
    # Plain-HTTP relay from 127.0.0.1:8000 on the host to app:8000 on the internal network.
    # TLS terminates in the host's reverse proxy, which must forward X-Forwarded-For.
    image: caddy:2.11.4-alpine@sha256:de23def33b17fb5d1290b0f6c2add1d70780e52341896c00a4c8a2a2fe9d355e
    restart: unless-stopped
    user: "65534:65534"
    # The config travels in an environment variable and is written to tmpfs at start: compose
    # `configs:` cannot be mounted into a read-only container, and a separate file would be one
    # more thing to copy to the air-gapped server.
    entrypoint: ["/bin/sh", "-c"]
    command:
      # The upload cap is 2 x PA_MAX_FILE_MB + 1 MiB, the app's own formula (Settings.
      # max_request_bytes), from the same .env variable. Caddy cannot do arithmetic, so it is
      # worked out here and handed over as an exact byte count. A value the app would not accept
      # as a whole number of megabytes stops the relay instead of leaving the uploads uncapped.
      - |
        case "$$PA_MAX_FILE_MB" in
          ''|0*|*[!0-9]*) echo "relay: PA_MAX_FILE_MB must be a whole number of megabytes, no leading zero" >&2; exit 1;;
        esac
        export PA_UPLOAD_MAX_BYTES=$$(( (2 * PA_MAX_FILE_MB + 1) * 1048576 ))
        printf '%s' "$$CADDYFILE" > /config/Caddyfile && exec caddy run --adapter caddyfile --config /config/Caddyfile
    environment:
      PA_MAX_FILE_MB: ${PA_MAX_FILE_MB:-50}
      CADDYFILE: |
        {
          admin off
          auto_https off
          servers {
            # Only the host's reverse proxy reaches this port (published on 127.0.0.1), and
            # Docker delivers it from the `edge` network's gateway. Trust exactly that address:
            # trusting all private ranges made an office client on 10.x/192.168.x count as
            # "another proxy", so its address was skipped (everyone shared the gateway's rate
            # limit bucket) or a value it prepended was believed. Strict parsing reads the
            # header right-to-left and stops at the first untrusted hop.
            trusted_proxies static ${PA_EDGE_GATEWAY:-172.30.232.1}/32
            trusted_proxies_strict
            client_ip_headers X-Forwarded-For
            timeouts {
              # A client that opens a connection and then says nothing holds a slot. Headers
              # must arrive in 10 s; a 100 MB upload has 5 minutes (about 3 Mbit/s); an idle
              # keep-alive connection is dropped after 2 minutes. No write timeout: a report
              # that takes minutes to compute is answered when it is ready.
              read_header 10s
              read_body 5m
              idle 2m
            }
          }
        }
        (capped) {
          # {args[0]} is the most bytes a request may carry, an exact count (Caddy would read "MB"
          # as 10^6). A body that announces more is refused with the app's own answer before one
          # byte of it is forwarded; a chunked body, which announces nothing, is cut off by
          # request_body once it has delivered more.
          @over expression `size({http.request.header.Content-Length}) > 0 && int({http.request.header.Content-Length}) > {args[0]}`
          header @over {
            Content-Type application/json
            Cache-Control no-store
            Content-Security-Policy "default-src 'none'; frame-ancestors 'none'"
            X-Content-Type-Options nosniff
            X-Frame-Options DENY
            Referrer-Policy no-referrer
            Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), bluetooth=(), accelerometer=(), gyroscope=(), magnetometer=(), interest-cohort=()"
            Cross-Origin-Opener-Policy same-origin
            Cross-Origin-Resource-Policy same-origin
            X-Permitted-Cross-Domain-Policies none
            Strict-Transport-Security "max-age=31536000; includeSubDomains"
          }
          respond @over `{"detail":"request body too large"}` 413 {
            close
          }
          request_body {
            max_size {args[0]}
          }
          # The app sends no Server header (uvicorn --no-server-header); neither does the relay,
          # and it adds no Via: there is nothing to tell a caller which software answered.
          header -Server
          header -Via
          reverse_proxy app:8000 {
            # One value, the resolved client address: the app trusts this hop only.
            header_up X-Forwarded-For {client_ip}
          }
        }
        :8080 {
          # Body caps, the same table the app enforces (security/body_limit.py, security/preauth.py;
          # tests/unit/test_relay_policy.py fails if they drift). They are applied here as well
          # because the app answers 413 as soon as it has counted past its cap and closes the
          # connection while the relay is still sending: the relay turned that reset into a 502
          # (11-14 of 15 requests over 1 MiB). Refused here, the caller gets the 413 and the
          # oversize body is never forwarded. Only the routes that take a file may carry more
          # than 1 MiB (1048576 bytes); every other path, listed or not, is held to it.
          @upload {
            method POST
            path /api/v1/documents /ui/documents/upload /ui/start/aoa /ui/start/compare
          }
          handle @upload {
            import capped {$$PA_UPLOAD_MAX_BYTES}
          }
          handle {
            import capped 1048576
          }
        }
    ports:
      - "127.0.0.1:8000:8080"
    networks:
      edge: {}
      internal:                              # the app is on this one; Ollama is not
        ipv4_address: ${PA_PROXY_IP:-172.30.231.10}
    depends_on: [app]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    read_only: true
    tmpfs:
      - /data:size=16m,uid=65534,gid=65534,noexec,nosuid,nodev
      - /config:size=16m,uid=65534,gid=65534,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    # The caddy binary carries a file capability for binding low ports; exec fails unless the
    # capability is in the bounding set, even though :8080 does not need it.
    cap_add: [NET_BIND_SERVICE]
    ulimits:
      core: 0
    mem_limit: 256m
    pids_limit: 128
    cpus: 1

networks:
  llm:
    internal: true          # app <-> ollama only; no egress, and the proxy is not on it
  internal:
    internal: true          # proxy <-> app only; no egress, and ollama is not on it
    ipam:
      config:
        # Fixed so the relay has a known address the app can trust. Change PA_INTERNAL_SUBNET
        # and PA_PROXY_IP together if this range collides with a network on the host.
        - subnet: ${PA_INTERNAL_SUBNET:-172.30.231.0/24}
  edge:
    ipam:
      config:
        # Fixed so the relay can trust exactly the gateway the host's traffic arrives from
        # (verified: remote address of a request to 127.0.0.1:8000 is this gateway).
        - subnet: ${PA_EDGE_SUBNET:-172.30.232.0/24}
          gateway: ${PA_EDGE_GATEWAY:-172.30.232.1}
    # The relay's side only; neither app nor ollama is attached. Masquerading off: the published
    # port still answers on 127.0.0.1, but the relay's own outbound traffic gets no NAT, so it
    # cannot reach the internet either (verified: wget to an outside address times out).
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"

volumes:
  app-data:
  ollama:
