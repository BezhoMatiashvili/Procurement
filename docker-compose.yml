# Production-style deployment. The app and Ollama share an INTERNAL network with no route to the
# outside world. A small relay (`proxy`) is the only container with a published port, and only
# on 127.0.0.1: put the TLS reverse proxy (Caddy/nginx with the company CA) in front of
# 127.0.0.1:8000 on the host. See docs/PRODUCTION_READINESS.md.
#
# Why the relay exists: Docker does not publish ports of a container whose only network is
# `internal: true` (verified on Docker 29: the port mapping is silently dropped). The app used
# to publish 127.0.0.1:8000 from the internal network, so nothing was ever listening there.
# Attaching the app to a second, routable network would give it egress; the relay keeps the
# app and Ollama without a default route, stores nothing, and gets no outbound NAT itself.
#
# Before first start (on a machine with internet): ./scripts/prefetch_models.sh
# Then copy ./models and the `ollama` volume to the server.
#
# Compose reads ${VARIABLES} below from the shell or from .env next to this file.

services:
  app:
    build: .
    image: procurement-agent:0.1.0
    restart: unless-stopped
    init: true                               # reap tesseract children, forward SIGTERM
    env_file: .env
    environment:
      PA_ENV: prod
      PA_OLLAMA_BASE_URL: http://ollama:11434
      PA_DATA_DIR: /data
      PA_DOCLING_ARTIFACTS_PATH: /models/docling
      # Baked into the image (Dockerfile), so a development path copied into .env cannot point
      # the prose spelling check at a directory the container does not have.
      PA_SPELLING_DICTIONARY_PATH: /app/dictionaries/hunspell
      # Only the relay may set X-Forwarded-For. Client addresses feed the audit log and the
      # rate-limit buckets; trusting any other peer would let a caller choose its own address.
      FORWARDED_ALLOW_IPS: ${PA_PROXY_IP:-172.30.231.10}
    volumes:
      - app-data:/data                       # uploads, results, SQLite — put this on an encrypted disk
      - ./models:/models:ro
    networks: [internal]
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      # /ready: DB reachable, job worker alive and heartbeating. /health stays pure liveness.
      test: ["CMD", "python", "-c", "import sys,urllib.request as u; sys.exit(0 if u.urlopen('http://127.0.0.1:8000/ready', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    # Docker's default of 10 s would SIGKILL a worker in the middle of writing a result. Keep
    # this above the worker's stop timeout (see .env.example).
    stop_grace_period: 60s
    read_only: true
    tmpfs:
      - /tmp:size=2g,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    mem_limit: 12g
    pids_limit: 512

  ollama:
    # Pinned by version AND digest: `latest` would change the model runtime (and therefore the
    # extraction output) on the next pull. Upgrade deliberately and re-run scripts/evaluate.py.
    image: ollama/ollama:0.34.2@sha256:da6e0dc5651df159e45686fd663c4dbe1624a52c44d7280eeac1551d8f865532
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama
    networks: [internal]
    environment:
      OLLAMA_KEEP_ALIVE: "-1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
    healthcheck:
      # The image has no curl/wget; `ollama list` talks to the local server and exits 1 when
      # it is not answering.
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    mem_limit: 16g
    pids_limit: 1024
    # no ports: reachable only from the app on the internal network

  proxy:
    # Plain-HTTP relay from 127.0.0.1:8000 on the host to app:8000 on the internal network.
    # TLS terminates in the host's reverse proxy, which must forward X-Forwarded-For.
    image: caddy:2.11.4-alpine@sha256:de23def33b17fb5d1290b0f6c2add1d70780e52341896c00a4c8a2a2fe9d355e
    restart: unless-stopped
    user: "65534:65534"
    # The config travels in an environment variable and is written to tmpfs at start: compose
    # `configs:` cannot be mounted into a read-only container, and a separate file would be one
    # more thing to copy to the air-gapped server.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - printf '%s' "$$CADDYFILE" > /config/Caddyfile && exec caddy run --adapter caddyfile --config /config/Caddyfile
    environment:
      CADDYFILE: |
        {
          admin off
          auto_https off
          servers {
            # Only the host's reverse proxy reaches this port (published on 127.0.0.1), and
            # Docker delivers it from the `edge` network's gateway. Trust exactly that address:
            # trusting all private ranges made an office client on 10.x/192.168.x count as
            # "another proxy", so its address was skipped (everyone shared the gateway's rate
            # limit bucket) or a value it prepended was believed. Strict parsing reads the
            # header right-to-left and stops at the first untrusted hop.
            trusted_proxies static ${PA_EDGE_GATEWAY:-172.30.232.1}/32
            trusted_proxies_strict
            client_ip_headers X-Forwarded-For
          }
        }
        :8080 {
          reverse_proxy app:8000 {
            # One value, the resolved client address: the app trusts this hop only.
            header_up X-Forwarded-For {client_ip}
          }
        }
    ports:
      - "127.0.0.1:8000:8080"
    networks:
      edge: {}
      internal:
        ipv4_address: ${PA_PROXY_IP:-172.30.231.10}
    depends_on: [app]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    read_only: true
    tmpfs:
      - /data:size=16m,uid=65534,gid=65534
      - /config:size=16m,uid=65534,gid=65534
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    # The caddy binary carries a file capability for binding low ports; exec fails unless the
    # capability is in the bounding set, even though :8080 does not need it.
    cap_add: [NET_BIND_SERVICE]
    mem_limit: 256m
    pids_limit: 128

networks:
  internal:
    internal: true          # no egress: containers cannot reach the internet at all
    ipam:
      config:
        # Fixed so the relay has a known address the app can trust. Change PA_INTERNAL_SUBNET
        # and PA_PROXY_IP together if this range collides with a network on the host.
        - subnet: ${PA_INTERNAL_SUBNET:-172.30.231.0/24}
  edge:
    ipam:
      config:
        # Fixed so the relay can trust exactly the gateway the host's traffic arrives from
        # (verified: remote address of a request to 127.0.0.1:8000 is this gateway).
        - subnet: ${PA_EDGE_SUBNET:-172.30.232.0/24}
          gateway: ${PA_EDGE_GATEWAY:-172.30.232.1}
    # The relay's side only; neither app nor ollama is attached. Masquerading off: the published
    # port still answers on 127.0.0.1, but the relay's own outbound traffic gets no NAT, so it
    # cannot reach the internet either (verified: wget to an outside address times out).
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"

volumes:
  app-data:
  ollama:
